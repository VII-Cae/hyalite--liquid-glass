<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>hyalite · social card</title>
<script src="../hyalite.js"></script>
<style>
  /* Fixed 1280×640 — GitHub's social preview aspect. Everything here is sized for a card that will
     be looked at around 500px wide in a timeline, so the grid is coarse and the type is large.
     Shot at deviceScaleFactor 1.5 → 1920×960, ~667 KB: retina, and under GitHub's 1 MB ceiling
     (2× lands at ~1 MB and gets rejected). Produced demo/shots/og-card.png. */
  html,body{margin:0;width:1280px;height:640px;overflow:hidden}
  body{
    position:relative;background-color:#0e1626;color:#f2efe6;
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background-image:
      radial-gradient(420px 420px at 9% 52%, rgba(255,77,109,.85) 0 30%, transparent 62%),
      radial-gradient(460px 460px at 90% 64%, rgba(255,209,102,.85) 0 30%, transparent 62%),
      radial-gradient(380px 380px at 64% 14%, rgba(6,214,160,.80) 0 30%, transparent 62%),
      repeating-linear-gradient(0deg, transparent 0 26px, rgba(255,255,255,.30) 26px 27.6px),
      repeating-linear-gradient(90deg, transparent 0 26px, rgba(255,255,255,.30) 26px 27.6px);
  }
  /* The title sits *behind* the glass on purpose: its lower half is bent by the lens, its upper
     half is not. That contrast is the entire pitch, and it survives being shrunk to a thumbnail. */
  /* The glass cuts the title at roughly 40 % of its height: the top of the word stays straight and
     the bottom is bent, and the seam lands on the top bevel where the displacement is strongest. */
  .title{position:absolute;left:0;right:0;top:128px;text-align:center;margin:0;
         font-size:196px;font-weight:800;letter-spacing:-.055em;line-height:1;
         color:rgba(255,255,255,.92);white-space:nowrap}
  .glass{position:absolute;left:50%;top:244px;transform:translateX(-50%);
         box-sizing:border-box;width:960px;height:262px;border-radius:56px;
         background:rgba(0,0,0,.10);
         border:1.5px solid rgba(255,255,255,.26);
         box-shadow:0 26px 60px rgba(0,0,0,.46), inset 0 1px 0 rgba(255,255,255,.62),
                    inset 0 -1px 0 rgba(255,255,255,.26),
                    inset 6px 0 16px -8px rgba(255,255,255,.55), inset -6px 0 16px -8px rgba(255,255,255,.55);
         backdrop-filter:var(--hyalite, blur(3px));-webkit-backdrop-filter:var(--hyalite, blur(3px));
         display:flex;align-items:flex-end;justify-content:center;padding-bottom:26px}
  .tag{font:600 25px/1 ui-monospace,Menlo,monospace;letter-spacing:.02em;
       color:rgba(255,255,255,.94);text-shadow:0 2px 10px rgba(0,0,0,.55)}
  .foot{position:absolute;left:0;right:0;bottom:34px;text-align:center;
        font:500 21px/1 ui-monospace,Menlo,monospace;letter-spacing:.04em;
        color:rgba(255,255,255,.80);text-shadow:0 2px 10px rgba(0,0,0,.7)}
  .warn{position:absolute;left:16px;top:12px;font:600 20px/1.3 ui-monospace,monospace;color:#ffb4a2}
</style></head>
<body>
<h1 class="title">hyalite</h1>
<div class="glass" id="glass"><span class="tag">the edge bends what is behind it</span></div>
<div class="foot">real refraction · one file · no WebGL · no build step</div>
<script>
(() => {
  if (!Hyalite.supported()) {
    document.body.insertAdjacentHTML('afterbegin',
      '<div class="warn">NOT SUPPORTED HERE — this card would ship a plain blur</div>');
    window.__ogReady = 'unsupported';
    return;
  }
  Hyalite.attach(document.getElementById('glass'), {
    bevel: 54, thickness: 15, blur: 0.4, dispersion: 0.10, rim: 0.8, light: -145,
    onBuild: () => { window.__ogReady = 'ok'; },
  });
})();
</script>
</body></html>
